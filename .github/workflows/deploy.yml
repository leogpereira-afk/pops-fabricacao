# Publica no GitHub Pages a cada push na main. MOLDE — dois sabores:
#   React+Vite: mantém o job como está (build + 404.html).
#   Vanilla (sem build): apague os passos de node/build e publique a pasta do
#     app direto (path: . ou path: publico) — e apague o passo do 404.html se o
#     app navega por hash (não precisa) ou mantenha se usa caminhos reais.
#
# Backend é o Supabase — nenhum segredo entra aqui. As chaves públicas (URL +
# anon key) podem ir versionadas em .env.production: são públicas por design,
# protegidas por RLS no servidor.
name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # App vanilla sem build: separa o SITE do que é ferramenta de repositório
      # (supabase/, seed/, sql.sh não são página). Navegação por hash: sem 404.html.
      - name: Separar os arquivos do site
        run: |
          mkdir -p dist
          rsync -a ./ dist/ \
            --exclude dist/ --exclude .git/ --exclude .github/ \
            --exclude supabase/ --exclude seed/ --exclude sql.sh
          ls dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
